services:
  - type: web
    name: rescuermap
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/rescuermap.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PROVIDER_MODE
        value: mock
      - key: PROVIDER_TIMEOUT_MS
        value: 5000
      - key: CORS_ORIGINS
        value: https://rescuermap.onrender.com
